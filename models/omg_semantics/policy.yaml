models:
  - name: policy
    semantic_model:
      enabled: true
    description: "Table containting policy data"
    agg_time_dimension: policy_effective_date
    columns:
      - name: Policy_Identifier
        entity:
          type: primary
          name: policy
      - name: Geographic_Location_Identifier
        entity:
          type: foreign
          name: geographic_location_identifier
      - name: policy_number
        dimension:
          type: categorical
      - name: status_code
        dimension:
          type: categorical
      - name: Effective_Date
        dimension:
          type: time
          name: policy_effective_date
        granularity: day
      - name: Expiration_Date
        dimension:
          type: time
          name: policy_expiration_date
        granularity: day
    metrics:
      - name: number_of_policies
        description: "The total number of policies."
        agg: sum
        expr: 1
        type: simple