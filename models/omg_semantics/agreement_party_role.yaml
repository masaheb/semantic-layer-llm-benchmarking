models:
  - name: agreement_party_role
    semantic_model:
      enabled: true
    agg_time_dimension: effective_date
    columns:
      - name: agreement_identifier
        entity:
          type: primary
          name: policy
      - name: party_identifier
        entity:
          type: foreign
        dimension:
          type: categorical
          name: party_identifier_dim
      - name: effective_date
        dimension:
          type: time
        granularity: day
      - name: expiration_date
        dimension:
          type: time
        granularity: day
      - name: party_role_code
        dimension:
          type: categorical
    metrics:
      - name: policies_by_party_role
        label: Policies by party (agent/holder)
        agg: count_distinct
        expr: agreement_identifier
        description: >-
          Distinct policies associated with a party. Group by party_identifier_dim
          and filter party_role_code ('AG' = agent, 'PH' = policy holder) to get
          policies sold per agent or held per policy holder.
        type: simple