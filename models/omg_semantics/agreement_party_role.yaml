models:
  - name: agreement_party_role
    semantic_model:
      enabled: true
    agg_time_dimension: effective_date
    columns:
      - name: agreement_identifier
        entity:
          type: primary
          name: policy
      - name: party_identifier
        entity:
          type: foreign
        dimension:
          type: categorical
          # Distinct name: policy_holder_policy also defines `party_identifier_dim`
          # (holders only). Sharing the name let MetricFlow resolve the agent's id
          # through the holder model (null for agents). Keep this one unambiguous.
          name: role_party_identifier
          description: Party id on this agreement role (agent when party_role_code='AG', holder when 'PH').
      - name: effective_date
        dimension:
          type: time
        granularity: day
      - name: expiration_date
        dimension:
          type: time
        granularity: day
      - name: party_role_code
        dimension:
          type: categorical
    metrics:
      - name: policies_by_party_role
        label: Policies by party (agent/holder)
        agg: count_distinct
        expr: agreement_identifier
        description: >-
          Distinct policies associated with a party. Group by
          policy__role_party_identifier and filter policy__party_role_code
          ('AG' = agent, 'PH' = policy holder) to get policies sold per agent
          or held per policy holder.
        type: simple