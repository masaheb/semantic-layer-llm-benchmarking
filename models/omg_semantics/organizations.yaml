models:
  - name: organizations
    semantic_model:
      enabled: true
      name: organizations
    description: "A table containing information about various organizations, including identifiers and industry classifications."
    columns:
      - name: Organization_Identifier
        entity:
          type: primary
          name: organization
      - name: Industry_Code
        dimension:
          type: categorical
          name: industry_code
      - name: Organization_Name
        dimension:
          type: categorical
          name: organization_name
      - name: Dun_And_Bradstreet_Identifier
        dimension:
          type: categorical
          name: dun_and_bradstreet_identifier
      - name: Organization_Type_Code
        dimension:
          type: categorical
          name: organization_type_code
      - name: Alternate_Name
        dimension:
          type: categorical
          name: alternate_name
      - name: Organization_Description
        dimension:
          type: categorical
          name: organization_description
      - name: Acronym_Name
        dimension:
          type: categorical
          name: acronym_name
      - name: Industry_Type_Code
        dimension:
          type: categorical
          name: industry_type_code