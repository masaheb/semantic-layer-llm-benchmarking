models:
  - name: agreement
    semantic_model:
      enabled: true
    columns:
      - name: agreement_type_code
        entity:
          type: primary
      - name: product_identifier
        entity:
          type: foreign
      - name: agreement_name
        dimension:
          type: categorical
      - name: agreement_original_inception_date
        dimension:
          type: time
        granularity: day