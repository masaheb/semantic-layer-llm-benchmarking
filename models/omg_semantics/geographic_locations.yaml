models:
  - name: geographic_location
    semantic_model:
      enabled: true
    description: "This semantic model represents various geographic locations along with their identifiers and types."
    columns:
      - name: Geographic_Location_Identifier
        entity:
          type: primary
          name: geographic_location
      - name: Location_Address_Identifier
        entity:
          type: foreign
          name: location_address
      - name: Parent_Geographic_Location_Identifier
        dimension:
          type: categorical
          name: parent_geographic_location
      - name: Geographic_Location_Type_Code
        dimension:
          type: categorical
          name: geographic_location_type
      - name: Location_Code
        dimension:
          type: categorical
          name: location_code
      - name: Location_Name
        dimension:
          type: categorical
          name: location_name
      - name: Location_Number
        dimension:
          type: categorical
          name: location_number
      - name: State_Code
        dimension:
          type: categorical
          name: state_code
      - name: Physical_Location_Identifier
        dimension:
          type: categorical
          name: physical_location