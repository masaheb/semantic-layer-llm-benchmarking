models:
  - name: insurable_object
    semantic_model:
      enabled: true
    description: "This table contains information about insurable objects, including their type and geographic location."
    columns:
      - name: Insurable_Object_Identifier
        entity:
          type: primary
          name: insurable_object_identifier
      - name: Geographic_Location_Identifier
        entity:
          type: foreign
          name: geographic_location
      - name: Insurable_Object_Type_Code
        dimension:
          type: categorical
          name: insurable_object_type