models:
  - name: policy_coverage_detail
    semantic_model:
      enabled: true
    description: "This semantic model represents the coverage details of policies including their effective dates, descriptions, and identifiers."
    agg_time_dimension: effective_date
    columns:
      - name: policy_coverage_detail_identifier
        entity:
          type: primary
          name: policy_coverage_detail
      - name: coverage_identifier
        entity:
          type: foreign
          name: coverage
      - name: insurable_object_identifier
        entity:
          type: foreign
          name: insurable_object
      - name: policy_identifier
        entity:
          type: foreign
          name: policy
      - name: effective_date
        dimension:
          type: time
        granularity: day
      - name: expiration_date
        dimension:
          type: time
        granularity: day
      - name: coverage_part_code
        dimension:
          type: categorical
      - name: coverage_description
        dimension:
          type: categorical
      - name: coverage_inclusion_exclusion_code
        dimension:
          type: categorical