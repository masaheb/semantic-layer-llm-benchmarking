models:
  - name: assessment
    semantic_model:
      enabled: true
    columns:
      - name: assessment_identifier
        entity:
          type: primary
      - name: assessment_description
        dimension:
          type: categorical
      - name: begin_date
        dimension:
          type: time
        granularity: day
      - name: end_date
        dimension:
          type: time
        granularity: day
      - name: assessment_reason_description
        dimension:
          type: categorical