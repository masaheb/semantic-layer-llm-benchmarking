models:
  - name: location_address
    semantic_model:
      enabled: true
    description: "This table contains address information, including historical data for addresses that can change over time."
    agg_time_dimension: begin_date
    columns:
      - name: location_address_identifier
        entity:
          type: primary
          name: location_address
      - name: line_1_address
        dimension:
          type: categorical
      - name: municipality_name
        dimension:
          type: categorical
      - name: line_2_address
        dimension:
          type: categorical
      - name: postal_code
        dimension:
          type: categorical
      - name: country_code
        dimension:
          type: categorical
      - name: state_code
        dimension:
          type: categorical
      - name: begin_date
        dimension:
          type: time
        granularity: day
      - name: end_date
        dimension:
          type: time
        granularity: day