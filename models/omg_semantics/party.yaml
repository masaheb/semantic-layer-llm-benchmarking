models:
  - name: party
    semantic_model:
      enabled: true
    description: "A table containing party information, including names, active dates, and types."
    agg_time_dimension: begin_date
    columns:
      - name: Party_Identifier
        entity:
          type: primary
          name: party
      - name: Party_Name
        dimension:
          type: categorical
          name: party_name
      - name: Begin_Date
        dimension:
          type: time
          name: begin_date
        granularity: day
      - name: End_Date
        dimension:
          type: time
          name: end_date
        granularity: day
      - name: Party_Type_Code
        dimension:
          type: categorical
          name: party_type_code