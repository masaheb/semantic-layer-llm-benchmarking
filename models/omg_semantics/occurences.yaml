models:
  - name: occurrences
    semantic_model:
      enabled: true
      name: occurrences
    description: "Details of various occurrences including dates, times, and locations."
    agg_time_dimension: occurrence_begin_date
    columns:
      - name: Occurrence_Identifier
        entity:
          type: primary
          name: occurrence
      - name: Geographic_Location_Identifier
        entity:
          type: foreign
          name: geographic_location_identifier
      - name: Catastrophic_Event_Indicator
        dimension:
          type: categorical
          name: catastrophic_event_indicator
      - name: occurrence_begin_date
        dimension:
          type: time
        granularity: day
      - name: occurrence_end_date
        dimension:
          type: time
        granularity: day
      - name: occurrence_begin_time
        dimension:
          type: time
        granularity: day
      - name: occurrence_end_time
        dimension:
          type: time
        granularity: day
      - name: Occurrence_Name
        dimension:
          type: categorical
          name: occurrence_name