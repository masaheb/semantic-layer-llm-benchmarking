models:
  - name: claim
    semantic_model:
      enabled: true
    agg_time_dimension: claims_made_date
    columns:
      - name: catastrophe_identifier
        entity:
          type: foreign
      - name: insurable_object_identifier
        entity:
          type: foreign
      - name: occurrence_identifier
        entity:
          type: foreign
      - name: claim_identifier
        entity:
          type: primary
      - name: claim_description
        dimension:
          type: categorical
      - name: company_claim_number
        dimension:
          type: categorical
      - name: company_subclaim_number
        dimension:
          type: categorical
      - name: claims_made_date
        dimension:
          type: time
        granularity: day
      - name: entry_into_claims_made_program_date
        dimension:
          type: time
        granularity: day
      - name: claim_open_date
        dimension:
          type: time
        granularity: day
      - name: claim_close_date
        dimension:
          type: time
        granularity: day
      - name: claim_reopen_date
        dimension:
          type: time
        granularity: day
      - name: claim_status_code
        dimension:
          type: time
        granularity: day
      - name: claim_reported_date
        dimension:
          type: time
        granularity: day
    metrics:
      - name: claims
        expr: company_claim_number
        agg: count
        type: simple
      - name: avg_time_to_settle_claim
        expr: DATEDIFF('day', claim_open_date, claim_close_date)
        agg: average
        type: simple